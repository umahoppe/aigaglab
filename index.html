<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIギャグ実験室 — バグは仕様です</title>
<meta name="description" content="AIがネタ・台本・作画までやっているギャグ漫画の実験室。コマを順にめくって、実験結果を見学できます。">
<meta property="og:title" content="AIギャグ実験室">
<meta property="og:description" content="AIが作り続けているギャグ漫画の実験室。バグは仕様です。">
<meta property="og:image" content="https://umahoppe.github.io/aigaglab/assets/chara/icon.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="assets/chara/icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* レイアウト: 建物の館内案内。左に階数表示（スマホは上の帯）、右に各階の展示。
   工場・研究所の安全標識の言葉づかいで統一する。方針は docs/homepage_design.md */
:root{
  --wall:#eef1ea; --board:#fbfcf8; --floor:#dde4d8; --ink:#14261f; --sub:#56665d; --line:#c5cfc2;
  --safe:#0a7d4f; --on-safe:#ffffff; --haz:#f6c20a; --on-haz:#1c1a08; --seal:#cf3a25; --shade:rgba(20,38,31,.9);
  --f-display:"Dela Gothic One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --wall:#101815; --board:#18231f; --floor:#0b110f; --ink:#e8efe6; --sub:#9baba1; --line:#2d3c35;
  --safe:#35c488; --on-safe:#06140e; --seal:#ff6a52; --shade:rgba(0,0,0,.88); color-scheme:dark } }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.7;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--haz);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 上の帯 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;line-height:1.3}
.cross{width:34px;height:34px;flex:none}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--safe);letter-spacing:.18em}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--board);border:2px solid var(--ink);border-radius:6px;padding:0 10px;min-height:40px;font-size:13px;font-weight:700;text-decoration:none;color:inherit}
.chip b{font-family:var(--f-mono);font-size:16px}
.find input{width:4.2em;border:0;background:none;font-family:var(--f-mono);font-size:16px;padding:4px 0}
.find button{border:0;background:var(--ink);color:var(--board);border-radius:4px;padding:4px 10px;font-weight:900;font-size:13px}
.msg{flex-basis:100%;text-align:right;font-size:13px;color:var(--seal);font-weight:700;margin:0}

/* 本日の実験 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center;background:var(--board);border:2px solid var(--ink);border-radius:10px;padding:28px}
.eyebrow{display:inline-flex;gap:10px;align-items:center;font-size:13px;font-weight:700;letter-spacing:.08em}
.eyebrow span{background:var(--safe);color:var(--on-safe);padding:2px 10px;border-radius:4px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6.4vw,64px);line-height:1.12;margin:14px 0 12px;text-wrap:balance}
.hook{font-size:18px;font-weight:700;margin:0 0 20px;padding-left:14px;border-left:5px solid var(--haz)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);border-radius:8px;padding:11px 18px;font-weight:900;background:var(--board);min-height:48px}
.btn.go{background:var(--safe);color:var(--on-safe);border-color:var(--safe)}
.btn.haz{background:var(--haz);color:var(--on-haz);border-color:var(--on-haz)}
.btn:hover{filter:brightness(1.06)}
.about{margin:22px 0 0;font-size:14px;color:var(--sub);max-width:34em}
.about b{color:var(--ink)}
.peek{display:grid;gap:10px;justify-items:center}
.peek button{padding:0;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--floor);width:min(100%,340px);aspect-ratio:4/5;display:block}
.peek img{width:100%;height:100%;object-fit:cover;display:block}
.pips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pip{font-family:var(--f-mono);font-size:12px;min-width:30px;text-align:center;padding:3px 7px;border:1.5px solid var(--line);border-radius:4px;color:var(--sub)}
.pip.on{background:var(--ink);color:var(--board);border-color:var(--ink)}
.pip.end{border-style:dashed;border-color:var(--sub)}

/* 館内 */
.building{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;margin-top:36px;align-items:start}
.guide{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--board);border:2px solid var(--ink);border-radius:10px;padding:12px;display:grid;gap:4px}
.guide h2{font-size:12px;letter-spacing:.3em;margin:2px 4px 6px;color:var(--sub)}
.guide a{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;text-decoration:none;color:inherit;padding:6px;border-radius:6px;font-size:13px;font-weight:700;line-height:1.3}
.guide a:hover{background:var(--floor)}
.guide a i{font-style:normal;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--ink);color:var(--board);text-align:center;border-radius:4px;padding:3px 0}
.guide a.b1 i{background:var(--haz);color:var(--on-haz)}
.floors{display:grid;gap:48px;min-width:0}
.floors section{scroll-margin-top:70px}
.sign{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
.sign .no{font-family:var(--f-display);font-size:44px;line-height:1;background:var(--ink);color:var(--board);padding:10px 12px 12px;border-radius:8px}
.sign h2{font-size:22px;font-weight:900;margin:0;line-height:1.3}
.sign p{margin:2px 0 0;font-size:14px;color:var(--sub)}
.tally{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--sub)}
.meter{flex:1;max-width:220px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--seal);width:0}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:18px 16px}
.card{position:relative;text-align:left;padding:0;border:0;background:none;display:grid;gap:4px;align-content:start;min-width:0}
.card .th{aspect-ratio:1/1;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--floor);margin-bottom:2px}
.card img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .25s}
.card:hover img{transform:scale(1.04)}
.card .id{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.card .t{font-weight:900;font-size:15px;line-height:1.35}
.card .k{font-size:12px;color:var(--sub)}
.done{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--seal);color:var(--seal);background:var(--board);display:grid;place-items:center;font-weight:900;font-size:15px;transform:rotate(-12deg)}
.more{margin-top:18px;width:100%;border-style:dashed}

/* 地下: 失敗標本室 */
.b1 .sign{border:2px solid var(--on-haz);padding:14px;border-radius:8px;
  background:repeating-linear-gradient(-45deg,var(--haz) 0 16px,var(--on-haz) 16px 32px)}
.b1 .sign>div:last-child{background:var(--haz);color:var(--on-haz);padding:8px 12px;border-radius:6px}
.b1 .sign p,.b1 .tally{color:var(--on-haz)}
.b1 .sign .no{background:var(--on-haz);color:var(--haz)}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.jar{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;background:var(--board);border:2px dashed var(--sub);border-radius:8px;padding:10px;align-items:start}
.jar img,.jar .void{width:92px;aspect-ratio:1/1;border-radius:5px;display:block}
.jar img{object-fit:cover;object-position:top;filter:grayscale(1) contrast(.9)}
.jar .void{background:var(--floor);display:grid;place-items:center;font-size:11px;color:var(--sub)}
.jar h3{margin:0;font-size:15px;font-weight:900;line-height:1.35}
.jar p{margin:4px 0 0;font-size:12.5px;line-height:1.6;color:var(--sub)}
.jar .id{font-family:var(--f-mono);font-size:11px;color:var(--seal);font-weight:500}

/* 研究員 */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.badge{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;background:var(--board);border:2px solid var(--ink);border-radius:8px;padding:10px}
.badge img{width:72px;height:72px;object-fit:cover;border-radius:6px;display:block}
.badge b{display:block;font-weight:900}
.badge small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--safe);letter-spacing:.04em}
.badge p{margin:3px 0 0;font-size:12.5px;line-height:1.55;color:var(--sub)}

footer{margin-top:56px;padding-block:28px 40px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px 20px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
footer strong{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}
footer a{color:var(--ink);font-weight:700}

/* 見学窓（リーダー） */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100%;height:100%}
dialog::backdrop{background:var(--shade)}
.room{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;max-width:560px;margin-inline:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.bar{display:flex;align-items:center;gap:8px;background:var(--board);border:2px solid var(--ink);border-radius:8px;padding:6px 6px 6px 12px}
.bar .id{font-family:var(--f-mono);font-size:12px;color:var(--sub);flex:none}
.bar b{flex:1;min-width:0;font-weight:900;font-size:15px;line-height:1.3}
.bar button{border:0;background:var(--floor);border-radius:6px;min-width:40px;height:40px;font-size:12px;font-weight:700;flex:none;padding:0 8px}
.bar #vX{font-size:20px}
.stage{position:relative;min-height:0;display:grid;place-items:center}
.stage img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;border:2px solid var(--ink);border-radius:8px;background:var(--floor);display:block}
.stage .tap{position:absolute;top:0;bottom:0;width:50%;border:0;background:none}
.stage .tap.l{left:0}.stage .tap.r{right:0}
.stamp{position:absolute;right:6%;bottom:8%;width:112px;height:112px;border-radius:50%;border:5px solid var(--seal);color:var(--seal);display:grid;place-items:center;text-align:center;font-weight:900;font-size:22px;line-height:1.15;transform:rotate(-14deg);background:color-mix(in srgb,var(--board) 82%,transparent);pointer-events:none;animation:press .45s cubic-bezier(.2,1.6,.4,1) both}
.stamp small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:500}
@keyframes press{from{transform:rotate(-14deg) scale(2.2);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.card img{transition:none}html{scroll-behavior:auto}}
.ctl{display:grid;gap:8px;background:var(--board);border:2px solid var(--ink);border-radius:8px;padding:8px}
.ctl .pips{min-height:26px}
.ctl .row{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.ctl .btn:disabled{opacity:.35;cursor:default}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr);padding:18px;gap:18px}
  .peek{order:-1}
  .peek button{width:min(100%,300px)}
  .hook{font-size:16px}
  .building{grid-template-columns:minmax(0,1fr);gap:20px}
  .guide{display:flex;overflow-x:auto;gap:6px;padding:8px;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:2}
  .guide h2{display:none}
  .guide a{display:block;flex:none;padding:0}
  .guide a span{display:none}
  .guide a i{display:block;padding:8px 12px;font-size:14px}
  .sign .no{font-size:32px}
  .sign h2{font-size:19px}
  .msg{text-align:left}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="cross" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="6" fill="var(--board)" stroke="var(--safe)" stroke-width="2"/><path d="M13 6h8v7h7v8h-7v7h-8v-7H6v-8h7z" fill="var(--safe)"/></svg>
      <div>AIギャグ実験室<small>笑い第一</small></div>
    </div>
    <div class="tools">
      <form class="chip find" id="find"><label for="findNo">No.</label><input id="findNo" type="text" inputmode="numeric" autocomplete="off" placeholder="208" aria-label="実験No.で探す"><button>開く</button></form>
      <div class="chip" title="最後まで読んだ実験の数。このブラウザに記録されます">見学スタンプ <b id="passN">0</b><span class="mono">/ <span id="passT"></span></span></div>
      <a class="chip" id="ig" target="_blank" rel="noopener">Instagram</a>
      <p class="msg" id="findMsg" role="status" hidden></p>
    </div>
  </header>

  <section class="hero" id="hero"></section>

  <div class="building">
    <nav class="guide" id="guide" aria-label="館内案内"><h2>館内案内</h2></nav>
    <main class="floors" id="floors"></main>
  </div>

  <footer>
    <strong>バグは仕様です。</strong>
    <span>ネタ・台本・作画はAI。人間の担当は「面白くなかった」と言う係。</span>
    <a id="ig2" target="_blank" rel="noopener">Instagram @aigaglab_jp</a>
  </footer>
</div>

<dialog id="viewer" aria-labelledby="vT">
  <div class="room">
    <div class="bar"><span class="id" id="vId"></span><b id="vT"></b><button id="vCopy">リンク</button><button id="vX" aria-label="閉じる">×</button></div>
    <div class="stage" id="stage">
      <img id="vImg" alt="">
      <button class="tap l" id="tapL" aria-label="前のコマ"></button>
      <button class="tap r" id="tapR" aria-label="次のコマ"></button>
    </div>
    <div class="ctl">
      <div class="pips" id="vPips"></div>
      <div class="row"><button class="btn" id="vPrev">前へ</button><button class="btn go" id="vNext">次のコマ</button></div>
    </div>
  </div>
</dialog>

<script src="data/site.js"></script>
<script>
const S = window.SITE_DATA;
const $ = (s, r = document) => r.querySelector(s);
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// タイトルがそのままフォルダ名なので、# や ? を含んでも壊れないように区切りごとに符号化する
const src = (p) => p.split('/').map(encodeURIComponent).join('/');
const no = (id) => 'No.' + String(id).padStart(3, '0');

const EPS = S.episodes.map((e) => ({ id: +e.id, t: e.title, w: e.ward, h: e.hook || '', p: e.panels.map(src) }));
const byId = new Map(EPS.map((e) => [e.id, e]));
const FLOORS = ['5F', '4F', '3F', '2F', '1F'];
const FIRST = 12; // 各階で最初に並べる本数。残りは「ぜんぶ出す」で開く
const kind = (e) => (e.p.length > 1 ? e.p.length + 'コマ' : '展示品・1枚');

// 見学スタンプ（このブラウザだけに残る。消えても表示は壊れない）
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('aigag-seen') || '[]')); } catch (e) {}
const mark = (id) => { seen.add(id); try { localStorage.setItem('aigag-seen', JSON.stringify([...seen])); } catch (e) {} paintSeen(); };

const card = (e) => `<button class="card" data-open="${e.id}">
  <span class="th"><img loading="lazy" src="${e.p[0]}" alt=""></span>
  <span class="id">${no(e.id)}</span><span class="t">${esc(e.t)}</span><span class="k">${kind(e)}</span></button>`;

function render() {
  $('#passT').textContent = EPS.length;
  $('#ig').href = $('#ig2').href = S.instagram;

  // 本日の実験 = いちばん新しい4〜6コマ（結果をめくる体験を最初に渡す）
  const h = EPS.find((e) => e.p.length > 1) || EPS[0];
  $('#hero').innerHTML = `
    <div>
      <div class="eyebrow"><span>本日の実験</span><b class="mono">${no(h.id)}</b></div>
      <h1>${esc(h.t)}</h1>
      ${h.h ? `<p class="hook">「${esc(h.h)}」</p>` : ''}
      <div class="acts">
        <button class="btn go" data-open="${h.id}">1コマ目から見学する</button>
        <button class="btn" id="dice">どれか適当に実験する</button>
      </div>
      <p class="about"><b>ここは、AIがギャグ漫画を作り続けている実験室です。</b>実験は${EPS.length}本、失敗した標本は地下に${S.rejected.length}体。結果のコマは、順番に見学した人だけが見られます。</p>
    </div>
    <div class="peek">
      <button data-open="${h.id}" aria-label="${esc(h.t)}を読む"><img src="${h.p[0]}" alt="${esc(h.t)} 1コマ目"></button>
      <div class="pips">${pips(h, 0)}</div>
    </div>`;

  const g = $('#guide'), f = $('#floors');
  S.wards.forEach((w, i) => {
    const eps = EPS.filter((e) => e.w === w.slug);
    if (!eps.length) return;
    g.append(el(`<a href="#f-${w.slug}"><i>${FLOORS[i]}</i><span>${esc(w.name)}</span></a>`));
    f.append(el(`<section id="f-${w.slug}" data-ward="${w.slug}">
      <div class="sign"><div class="no">${FLOORS[i]}</div><div><h2>${esc(w.name)}</h2><p>${esc(w.desc)}</p>
        <div class="tally"><span class="meter"><i></i></span><span>見学 <b class="mono" data-n></b> / ${eps.length}本</span></div></div></div>
      <div class="shelf">${eps.slice(0, FIRST).map(card).join('')}</div>
      ${eps.length > FIRST ? `<button class="btn more" data-more="${w.slug}">この階をぜんぶ出す（あと${eps.length - FIRST}本）</button>` : ''}
    </section>`));
  });
  if (S.rejected.length) {
    g.append(el(`<a class="b1" href="#f-b1"><i>B1</i><span>失敗標本室</span></a>`));
    f.append(el(`<section id="f-b1" class="b1">
      <div class="sign"><div class="no">B1</div><div><h2>失敗標本室</h2><p>ボツになった実験の保管庫。実験No.は返却され、次の実験が使います。</p>
        <div class="tally"><span>保管 ${S.rejected.length}体</span></div></div></div>
      <div class="spec">${S.rejected.map((r) => `<article class="jar">
        ${r.panels.length ? `<img loading="lazy" src="${src(r.panels[0])}" alt="">` : '<span class="void">絵になる前に没</span>'}
        <div><span class="id">${r.specimen ? '検体 #' + esc(r.specimen) : '検体番号 未発行'}${r.rejectedAt ? '・' + esc(r.rejectedAt) + ' 没' : ''}</span><h3>${esc(r.title)}</h3><p>${esc(r.sum)}</p></div></article>`).join('')}</div>
    </section>`));
  }
  g.append(el(`<a href="#f-crew"><i>受付</i><span>研究員</span></a>`));
  f.append(el(`<section id="f-crew">
    <div class="sign"><div class="no">受付</div><div><h2>研究員</h2><p>実験に出てくる顔ぶれ。</p></div></div>
    <div class="crew">${S.crew.map((c) => `<div class="badge"><img loading="lazy" src="${src(c.img)}" alt="">
      <div><small>${esc(c.role)}</small><b>${esc(c.name)}</b><p>${esc(c.desc)}</p></div></div>`).join('')}</div>
  </section>`));
  paintSeen();
}

function pips(e, at) {
  const n = e.p.length;
  if (n === 1) return '<span class="pip on">展示品</span>';
  return e.p.map((_, i) => `<span class="pip ${i === at ? 'on' : ''} ${i === n - 1 ? 'end' : ''}">${i === n - 1 ? '結果' : i + 1}</span>`).join('');
}

function paintSeen() {
  $('#passN').textContent = EPS.filter((e) => seen.has(e.id)).length;
  document.querySelectorAll('[data-ward]').forEach((s) => {
    const eps = EPS.filter((e) => e.w === s.dataset.ward), n = eps.filter((e) => seen.has(e.id)).length;
    $('[data-n]', s).textContent = n; $('.meter i', s).style.width = (100 * n / eps.length) + '%';
  });
  document.querySelectorAll('.card').forEach((c) => {
    const on = seen.has(+c.dataset.open), b = $('.done', c);
    if (on && !b) c.append(el('<span class="done" aria-label="見学済">済</span>'));
    if (!on && b) b.remove();
  });
}

// 見学窓
const V = $('#viewer'); let cur = null, at = 0;
const hashOf = (id) => '#ep-' + String(id).padStart(3, '0');
function open(id) {
  const e = byId.get(+id); if (!e) return false;
  cur = e; at = 0;
  $('#vId').textContent = no(cur.id); $('#vT').textContent = cur.t; $('#vCopy').textContent = 'リンク';
  if (!V.open) V.showModal();
  try { history.replaceState(null, '', hashOf(cur.id)); } catch (err) {}
  show(); return true;
}
function show() {
  const n = cur.p.length, last = at === n - 1;
  $('#vImg').src = cur.p[at]; $('#vImg').alt = `${cur.t} ${at + 1}コマ目`;
  if (cur.p[at + 1]) new Image().src = cur.p[at + 1];
  $('#vPips').innerHTML = pips(cur, at);
  $('#vPrev').disabled = at === 0;
  const nx = $('#vNext');
  nx.className = 'btn ' + (last ? '' : at === n - 2 ? 'haz' : 'go');
  nx.textContent = last ? '次の実験へ' : at === n - 2 ? '結果を見る' : '次のコマ';
  $('.stamp', $('#stage'))?.remove();
  if (last) {
    const fresh = !seen.has(cur.id); mark(cur.id);
    if (fresh) $('#stage').append(el(`<div class="stamp"><div>見学済<small>${no(cur.id)}</small></div></div>`));
  }
}
function step(d) {
  if (!cur) return;
  if (d > 0 && at === cur.p.length - 1) return open(pick());
  at = Math.max(0, Math.min(cur.p.length - 1, at + d)); show();
}
// まだ読んでいない回を優先して選ぶ
function pick() {
  const rest = EPS.filter((e) => e !== cur), fresh = rest.filter((e) => !seen.has(e.id));
  const from = fresh.length ? fresh : rest;
  return from[Math.floor(Math.random() * from.length)].id;
}
V.addEventListener('close', () => { cur = null; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} });
V.addEventListener('click', (e) => { if (e.target === V) V.close(); });
$('#vX').onclick = () => V.close();
$('#vPrev').onclick = $('#tapL').onclick = () => step(-1);
$('#vNext').onclick = $('#tapR').onclick = () => step(1);
$('#vCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); $('#vCopy').textContent = 'コピー済'; } catch (e) { $('#vCopy').textContent = '失敗'; }
};
document.addEventListener('keydown', (e) => { if (!V.open) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
document.addEventListener('click', (e) => {
  const o = e.target.closest('[data-open]'); if (o) return open(o.dataset.open);
  if (e.target.closest('#dice')) return open(pick());
  const m = e.target.closest('[data-more]');
  if (m) {
    const eps = EPS.filter((x) => x.w === m.dataset.more).slice(FIRST);
    m.previousElementSibling.insertAdjacentHTML('beforeend', eps.map(card).join('')); m.remove(); paintSeen();
  }
});

// No.で探す（Instagramの投稿本文に No. が入っている）
$('#find').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('#findNo').value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\D/g, '');
  const msg = $('#findMsg');
  if (v && open(v)) { msg.hidden = true; $('#findNo').value = ''; return; }
  msg.textContent = v ? `${no(v)} は見つかりません。欠番か、ボツになった実験です。` : '実験No.を数字で入れてください。';
  msg.hidden = false;
});

const fromHash = () => { const m = /^#ep-0*(\d+)$/.exec(location.hash); if (m) open(m[1]); };
render(); fromHash(); addEventListener('hashchange', fromHash);
</script>
</body>
</html>
